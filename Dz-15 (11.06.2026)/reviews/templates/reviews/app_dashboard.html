<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відгуки та Рецензії</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">
    <div class="container">
        <div class="card p-4 shadow-sm mb-4">
            <h2>Відгук про мобільний додаток</h2>
            <form method="post">
                {% csrf_token %}
                {{ app_form.as_p }}

                <button type="submit" name="submit_app" 
                        class="btn btn-primary">
                    Надіслати відгук
                </button>
            </form>
        </div>

        {% for review in app_reviews %}
            <div class="alert alert-success shadow-sm">
                <p>
                    <strong>Користувач:</strong> 
                    {{ review.nickname }} 
                    ({{ review.email }})
                </p>

                <p>
                    <strong>Оцінка:</strong> 
                    {% for i in "x"|ljust:review.stars %}⭐{% endfor %} 
                    ({{ review.stars }}/5)
                </p>

                <p><strong>Досвід:</strong></p>
                <blockquote class="bg-white p-3 border rounded">
                    {{ review.experience|linebreaks }}
                </blockquote>
            </div>
        {% endfor %}
    </div>
</body>
</html>
